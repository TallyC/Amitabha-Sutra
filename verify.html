<!doctype html><meta charset="utf-8"><pre id="o" style="white-space:pre-wrap">running…</pre>
<script>
const H=s=>Array.from(s).filter(c=>/[㐀-鿿豈-﫿]|[\u{20000}-\u{3ffff}]/u.test(c)).join('');
async function load(url,ed){const x=await (await fetch(url)).text();let b=x.slice(x.indexOf('<body>'));
 b=b.replace(/<note[^>]*\/>/g,'').replace(/<rdg[^>]*\/>/g,'').replace(/<note[\s\S]*?<\/note>/g,'').replace(/<rdg[\s\S]*?<\/rdg>/g,'');
 b=b.replace(/<lb[^>]*?\bn="(\d{4}[a-z]\d{2})"[^>]*?\/>/g,(m,n)=>/ed="(X|T)"/.test(m)?'\u0001'+n+'\u0002':'');
 b=b.replace(/<g [^>]*?ref="#(CB\d+)"[^>]*\/>/g,'?').replace(/<[^>]+>/g,'');
 let txt='',ln=[],cur='';let i=0;while(i<b.length){const c=b[i];if(c==='\u0001'){const j=b.indexOf('\u0002',i);cur=b.slice(i+1,j);i=j+1;continue}
  if(/[㐀-鿿豈-﫿]/.test(c)||(c>='\ud840'&&c<='\ud87f')){txt+=c;ln.push(cur)}i++}
 return {txt,ln}}
(async()=>{const o=document.getElementById('o');let out=[];try{
const h=await (await fetch('index.html')).text();
const g=n=>JSON.parse(h.match(new RegExp('const '+n+'=(\\{[\\s\\S]*?\\});\\n'))[1]);
const LC=g('DEEPLC'),LL=g('LCLN'),OY=g('DEEPOY'),OL=g('OYLN');
const X=await load('https://raw.githubusercontent.com/cbeta-org/xml-p5/master/X/X22/X22n0424.xml');
const T=await load('https://raw.githubusercontent.com/cbeta-org/xml-p5/master/T/T37/T37n1762.xml');
out.push('X len '+X.txt.length+' T len '+T.txt.length);
const key=l=>{const m=l.match(/(\d{4})([a-z])(\d{2})/);return m?m[1]+m[2]+m[3]:l};
function chk(name,D,L,W){for(let k=1;k<=15;k++){const t=D[k]||'';const qs=(t.match(/「([^」]+)」/g)||[]).map(s=>s.slice(1,-1));
 const lo=key(L[k]),hi=L[k+1]?key(L[k+1]):'9999z99';
 for(const q of qs){const h2=H(q);if(h2.length<3)continue;let idx=W.txt.indexOf(h2),all=[];while(idx>=0){all.push(W.ln[idx]);idx=W.txt.indexOf(h2,idx+1)}
  const inr=all.some(l=>l>=lo&&l<hi);out.push(name+' '+k+' 「'+q+'」 '+(all.length?(inr?'OK範圍內 ':'只在別處 ')+all.slice(0,3).join(','):'找不到'))}}}
chk('疏鈔',LC,LL,X);chk('要解',OY,OL,T);
}catch(e){out.push('ERROR '+e)}o.textContent=out.join('\n')})();
</script>
